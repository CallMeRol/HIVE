name: ci

on:
  push:
  pull_request:

jobs:
  guard:
    name: 补丁面守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: patch surface fail-closed
        run: node scripts/check-vendor-patches.mjs
      - name: guard tests
        run: node --test scripts/check-vendor-patches.test.mjs

  vendored:
    name: vendored 构建门（typecheck + test + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/teahouse/package-lock.json
      - name: install
        run: npm ci --prefix vendor/teahouse
      - name: typecheck
        run: npm run typecheck --prefix vendor/teahouse
      - name: test
        run: npm test --prefix vendor/teahouse
      - name: build
        run: npm run build --prefix vendor/teahouse
